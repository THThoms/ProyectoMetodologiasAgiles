# Sirve la SPA y delega rutas desconocidas a index.html (HTML5 history mode).
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Cache largo para assets versionados de Vite
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA: cualquier path no encontrado devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
