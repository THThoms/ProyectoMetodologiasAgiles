# Sirve la SPA y delega rutas desconocidas a index.html (HTML5 history mode).
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Cache largo para assets versionados de Vite
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA: cualquier path no encontrado devuelve index.html.
    # index.html nunca se cachea: tras una actualización, un index.html antiguo
    # apunta a assets con hash que ya no existen (pantalla en blanco hasta vaciar
    # la caché). Los assets versionados sí se cachean (bloque anterior).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
